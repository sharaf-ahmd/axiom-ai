name: Axiom AI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run:
          pip install -r requirements.txt

      - name: Validate DATABASE_URL format
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os
          from sqlalchemy.engine import make_url

          url = os.environ.get("DATABASE_URL", "")
          print("Length:", len(url))
          print("Starts with:", url[:20] if url else "(empty)")
          print("Has leading/trailing whitespace:", url != url.strip())
          print("Contains literal quote chars:", '"' in url or "'" in url)

          try:
              parsed = make_url(url)
              print("Parsed OK. Driver:", parsed.drivername, "Host:", parsed.host, "DB:", parsed.database)
          except Exception as e:
              print("Parse failed:", e)
          EOF

      - name: Run tests
        working-directory: backend
        env:
         PYTHONPATH: .
         APP_NAME: ${{ secrets.APP_NAME }}
         ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
         POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
         POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
         POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
         DATABASE_URL: ${{ secrets.DATABASE_URL }}
         REDIS_URL: ${{ secrets.REDIS_URL }}
         LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
         JWT_SECRET: ${{ secrets.JWT_SECRET }}
         JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
        run:
          pytest


      - name: Build Docker image
        run:
          docker build -t axiom-api ./backend